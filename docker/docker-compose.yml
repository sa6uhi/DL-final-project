# Serving + training stack.
# Default `docker compose up --build` starts the API.
# `docker compose --profile train up --build` additionally runs the training container.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.infer
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    volumes:
      - ../models/checkpoints:/app/models/checkpoints:ro
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  train:
    profiles: ["train"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    environment:
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
    command: ["run_all.sh"]
