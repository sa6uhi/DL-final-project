name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (>=80% coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==26.5.1 flake8==7.3.0

      - name: Formatting check (black)
        run: black --check src tests

      - name: Lint check (flake8)
        run: flake8 src tests

      - name: Unit tests with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/
