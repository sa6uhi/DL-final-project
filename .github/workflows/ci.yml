name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (overwrites existing image in GHCR)"
        required: true
        type: string
        default: "v1.0-final"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"
  UV_TORCH_BACKEND: "cpu"

jobs:
  lint:
    name: Lint (black + flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-format.txt

      - name: Install lint dependencies
        run: uv pip install -r requirements-format.txt

      - name: Formatting check (black)
        run: black --check src tests

      - name: Lint check (flake8)
        run: flake8 src tests

  test:
    name: Tests (>=80% coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-format.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt

      - name: Prune uv cache before save
        run: uv cache prune --ci

      - name: Unit tests with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/

  docker-images:
    name: Build & Publish Docker Images (GHCR)
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for GHCR tag
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.infer
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/dl-final-project-api:${{ inputs.image_tag || 'v1.0-final' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/dl-final-project-train:${{ inputs.image_tag || 'v1.0-final' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
