name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"
  UV_TORCH_BACKEND: "cpu"

jobs:
  lint:
    name: Lint (black + flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-format.txt

      - name: Install lint dependencies
        run: uv pip install -r requirements-format.txt

      - name: Formatting check (black)
        run: black --check src tests

      - name: Lint check (flake8)
        run: flake8 src tests

  test:
    name: Tests (>=80% coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-format.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: uv pip install -r requirements-ci.txt

      - name: Prune uv cache before save
        run: uv cache prune --ci

      - name: Unit tests with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/
