name: Build & Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (overwrites in GHCR)"
        required: true
        type: string
        default: "v1.0-final"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for GHCR tag
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push inference image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.infer
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/dl-final-project-api:${{ inputs.image_tag || 'v1.0-final' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push training image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/dl-final-project-train:${{ inputs.image_tag || 'v1.0-final' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
