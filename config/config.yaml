# Centralized configuration - single source of truth for all hyperparameters,
# paths, and seeds. No module may hardcode values that belong here.
project:
  name: "Real-Time Financial Fraud Detection Engine"
  version: "0.1.0"

seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  checkpoints: "models/checkpoints"
  logs: "logs"
  figures: "figures"
  experiments: "experiments"

logging:
  level: "INFO"
  log_file: "logs/system.log"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

# ---------------------------------------------------------------------------
# Semi-Supervised Deep Denoising Autoencoder
# ---------------------------------------------------------------------------
autoencoder:
  # DAE input dimension: 400 continuous features (incl. sequence columns) +
  # 400 missingness (`_is_nan`) indicators after preprocessing.
  input_dim: 800
  encoder_hidden_dims: [256, 128]
  latent_dim: 32
  activation: "leaky_relu"
  activation_slope: 0.2
  dropout: 0.2
  noise_std: 0.1
  feature_dropout_prob: 0.1

  training:
    lr: 1.0e-3
    weight_decay: 1.0e-5
    epochs: 35
    batch_size: 256
    num_workers: 4
    pin_memory: true
    early_stopping_patience: 6
    min_delta: 1.0e-4
    val_check_interval_epochs: 1

  loss:
    mse_weight: 0.5
    bce_weight: 0.5

  anomaly_score:
    l1_gamma: 0.4
    normalize_percentile: 99.9

# ---------------------------------------------------------------------------
# Supervised Feature-Tokenizer Cross-Attention Transformer (FT-CAT)
# ---------------------------------------------------------------------------
transformer:
  d_model: 32
  n_heads: 4
  dim_feedforward: 64
  n_layers: 2
  dropout: 0.1
  activation: "gelu"
  norm_first: true
  seq_len: 5
  n_continuous: 100
  categorical_cardinalities: []
  use_cross_attention: true

  training:
    lr: 3.0e-4
    weight_decay: 1.0e-2
    epochs: 30
    batch_size: 256
    warmup_epochs: 5
    grad_clip: 5.0
    amp: true
    num_workers: 4
    pin_memory: true
    early_stopping_patience: 5
    min_delta: 1.0e-4

  loss:
    name: "focal"
    gamma: 2.0
    alpha: 0.25
    pos_weight: null

  # Exp-3: FT-CAT vs self-attention-only vs MLP architecture ablation
  ablation:
    variants: ["ft_cat", "ft_self_only", "mlp"]
    seeds: [42, 43, 44]
    epochs: 10

  # Exp-4: Focal Loss gamma/alpha sensitivity sweep vs weighted BCE control
  focal_sweep:
    gammas: [0.5, 1.0, 2.0, 3.0, 5.0]
    alphas: [0.1, 0.25, 0.5]
    epochs: 8
    seeds: [42]

# ---------------------------------------------------------------------------
# Hybrid Decision Gating - fuses DAE residuals with FT-Transformer posteriors
# ---------------------------------------------------------------------------
hybrid_gating:
  alpha: 0.5

# ---------------------------------------------------------------------------
# Serving microservice
# ---------------------------------------------------------------------------
serving:
  host: "0.0.0.0"
  port: 8000
  request_timeout_ms: 100
  max_batch_size: 256
  model_path: "models/checkpoints/autoencoder.pt"
  transformer_path: "models/checkpoints/ft_transformer.pt"
  max_history: 10000
  anomaly_const: 2.0

scoring:
  approve_threshold: 0.15
  block_threshold: 0.85
  escalate_threshold: 0.50

# ---------------------------------------------------------------------------
# Evaluation experiments (Exp-5 latency, Exp-6 DAE anomaly evaluation)
# ---------------------------------------------------------------------------
evaluation:
  latency:
    n_warmup: 10
    n_runs: 200
    batch_sizes: [1, 8, 32, 64]
  anomaly_eval:
    max_fpr: 0.01
    alpha_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]

# ---------------------------------------------------------------------------
# Member A: Data Ingestion & Pipeline Configuration
# ---------------------------------------------------------------------------
data:
  raw_dir: "data/raw"
  raw_transaction_path: "data/raw/train_transaction.csv"
  raw_identity_path: "data/raw/train_identity.csv"
  processed_dir: "data/processed"
  preprocessor_path: "data/processed/preprocessor.pkl"
  train_data_path: "data/processed/train.parquet"
  val_data_path: "data/processed/val.parquet"
  test_data_path: "data/processed/test.parquet"
  # Columns that are never model features (identifiers, target, sequence tensor).
  non_feature_cols:
    - "TransactionID"
    - "TransactionDT"
    - "isFraud"
    - "sequence_array"

split:
  time_col: "TransactionDT"

sequence:
  group_cols:
    - "card1"
    - "addr1"
  k_window: 5
  feature_cols:
    - "TransactionAmt"
    - "D1"
    - "D2"
    - "D3"
    - "D4"
    - "D5"
    - "D6"
    - "D8"
    - "D9"
    - "D15"

features:
  target_col: "isFraud"
